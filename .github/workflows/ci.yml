name: CI

on:
  push:
    branches: ["**"]
    # Releases have been tagged both ways (V1.0.4 / v1.2.3); tag filters are case-sensitive.
    tags: ["v*", "V*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: StreamCrate.sln
  APP_PROJECT: src/StreamCrate.App/StreamCrate.App.csproj
  TEST_PROJECT: tests/StreamCrate.Tests/StreamCrate.Tests.csproj
  PUBLISH_DIR: artifacts/publish

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore $env:SOLUTION --locked-mode
      # StreamCrate.sln maps every project's Release|x64 to Release|Any CPU, so a solution build
      # writes to bin/Release/. Passing -p:Platform=x64 to dotnet test invokes the project
      # directly, where the property does apply, and it then looks for the assembly under
      # bin/x64/Release/ and fails with "test source file ... was not found". The app project
      # pins its own RuntimeIdentifier, so no platform property is needed here.
      - name: Build Release
        run: dotnet build $env:SOLUTION -c Release --no-restore
      - name: Run tests
        run: dotnet test $env:TEST_PROJECT -c Release --no-build --no-restore

  package-release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore $env:SOLUTION --locked-mode
      # The in-app updater compares the installed assembly version with the release tag,
      # so both the app and the installer take their version from the tag (v1.2.3 / V1.2.3).
      - name: Resolve version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got ${{ github.ref_name }}" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish self-contained x64 app
        run: dotnet publish $env:APP_PROJECT -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:Version=$env:APP_VERSION --no-restore -o $env:PUBLISH_DIR
      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/StreamCrate.iss
          options: /DMyAppVersion=${{ env.APP_VERSION }}
      - name: Generate installer checksum
        shell: pwsh
        run: Get-FileHash artifacts/installer/StreamCrate-Setup-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash) *$($_.Path | Split-Path -Leaf)" } | Set-Content artifacts/installer/StreamCrate-Setup-x64.exe.sha256 -NoNewline
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/installer/StreamCrate-Setup-x64.exe
            artifacts/installer/StreamCrate-Setup-x64.exe.sha256
