name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: StreamCrate.sln
  APP_PROJECT: src/StreamCrate.App/StreamCrate.App.csproj
  TEST_PROJECT: tests/StreamCrate.Tests/StreamCrate.Tests.csproj
  PUBLISH_DIR: artifacts/publish

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore $env:SOLUTION --locked-mode
      - name: Build x64 Release
        run: dotnet build $env:SOLUTION -c Release -p:Platform=x64 --no-restore
      - name: Run tests
        run: dotnet test $env:TEST_PROJECT -c Release -p:Platform=x64 --no-build --no-restore

  package-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore $env:SOLUTION --locked-mode
      - name: Publish self-contained x64 app
        run: dotnet publish $env:APP_PROJECT -c Release -r win-x64 --self-contained true -p:Platform=x64 --no-restore -o $env:PUBLISH_DIR
      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/StreamCrate.iss
      - name: Generate installer checksum
        shell: pwsh
        run: Get-FileHash artifacts/installer/StreamCrate-Setup-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash) *$($_.Path | Split-Path -Leaf)" } | Set-Content artifacts/installer/StreamCrate-Setup-x64.exe.sha256 -NoNewline
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/installer/StreamCrate-Setup-x64.exe
            artifacts/installer/StreamCrate-Setup-x64.exe.sha256
